<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile | Olayinka Photography</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #111;
      padding: 16px 20px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header img {
      height: 42px;
      width: auto;
      display: block;
    }

    .back {
      color: #d6b76c;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 650px;
      margin: 0 auto;
      padding: 35px 20px 60px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .intro {
      color: #aaa;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d6b76c;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0d0d0d;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d6b76c;
    }

    input[readonly] {
      color: #888;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #d6b76c;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .role {
      margin-top: 20px;
      padding: 12px;
      background: #101010;
      border-radius: 8px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <a href="../dashboard/index.html" class="back">← Dashboard</a>

    <img
      src="https://qgaqdnlqftlazzqxykia.supabase.co/storage/v1/object/public/site-assets/logo/IMG-20260924-WA0031.jpg"
      alt="OLAYINKA PHOTOGRAPHY"
    >
  </header>

  <main>

    <h1>My Profile</h1>

    <p class="intro">
      Update your personal information used for your bookings and account.
    </p>

    <div class="card">

      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        readonly
      >

      <label for="fullName">Full name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
      >

      <label for="phone">Phone number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
      >

      <button id="saveBtn">
        Save Changes
      </button>

      <div id="message"></div>

    

    </div>

  </main>

  <script>
    // @ts-nocheck

    const supabaseUrl =
      "https://qgaqdnlqftlazzqxykia.supabase.co";

    const supabaseKey =
      "sb_publishable_3ZomhHBPqFeZUw7C6RNEfg_EBP4OwvH";

    const supabaseClient =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );

    const emailInput = document.getElementById("email");
    const fullNameInput = document.getElementById("fullName");
    const phoneInput = document.getElementById("phone");
    const saveBtn = document.getElementById("saveBtn");
    const message = document.getElementById("message");

    async function loadProfile() {

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.href = "../../login.html";
        return;
      }

      emailInput.value = user.email || "";

      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("full_name, phone, avatar_url, role")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError) {
        console.error(profileError);
        message.textContent = "Unable to load your profile.";
        message.style.color = "#ff7777";
        return;
      }

      if (profile) {
        fullNameInput.value = profile.full_name || "";
        phoneInput.value = profile.phone || "";
      
      }
    }

    saveBtn.addEventListener("click", async () => {

      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.href = "../../login.html";
        return;
      }

      const fullName = fullNameInput.value.trim();
      const phone = phoneInput.value.trim();

      if (!fullName) {
        message.textContent = "Please enter your full name.";
        message.style.color = "#ff7777";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const { error } = await supabaseClient
        .from("profiles")
        .update({
          full_name: fullName,
          phone: phone
        })
        .eq("id", user.id);

      if (error) {
        console.error(error);
        message.textContent = "Unable to save your changes.";
        message.style.color = "#ff7777";
      } else {
        message.textContent = "Profile updated successfully.";
        message.style.color = "#d6b76c";
      }

      saveBtn.disabled = false;
      saveBtn.textContent = "Save Changes";
    });

    loadProfile();
  </script>

</body>
</html>
