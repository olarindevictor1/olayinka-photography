<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Olayinka Photography</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 430px;
      background: #1b1b1b;
      padding: 35px 25px;
      border-radius: 14px;
    }

    .logo {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #c9a86a;
      margin-bottom: 30px;
      font-size: 14px;
    }

    h2 {
      font-family: Georgia, serif;
      margin-bottom: 8px;
    }

    .intro {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #c9a86a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #c9a86a;
      color: #111;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    .links a {
      color: #c9a86a;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="logo">OLAYINKA</div>
    <div class="subtitle">PHOTOGRAPHY</div>

    <h2>Create your account</h2>

    <p class="intro">
      Create an account to book photography sessions and manage your bookings.
    </p>

    <form id="signupForm">

      <label for="fullName">Full name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Your full name"
        required
      >

      <label for="phone">Phone number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Your phone number"
        required
      >

      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
        minlength="8"
        required
      >

      <button type="submit" id="signupButton">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="links">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a class="home" href="index.html">← Back to website</a>

  </div>

  <script>

    const supabaseUrl =
      "https://qgaqdnlqftlazzqxykia.supabase.co";

    const supabaseKey =
      "sb_publishable_3ZomhHBPqFeZUw7C6RNEfg_EBP4OwvH";

    const supabaseClient =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );


    const form =
      document.getElementById("signupForm");

    const button =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      const fullName =
        document.getElementById("fullName").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      message.textContent = "";
      message.style.color = "";


      if (password !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.style.color =
          "#ff7777";

        return;
      }


      button.disabled = true;

      button.textContent =
        "Creating account...";


      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {
              full_name: fullName,
              phone: phone
            },

            emailRedirectTo:
              "http://localhost:8158"
          }

        });


      if (error) {

        message.textContent =
          error.message;

        message.style.color =
          "#ff7777";

        button.disabled = false;

        button.textContent =
          "Create Account";

        return;
      }


      if (data.user) {

        message.style.color =
          "#c9a86a";


        if (data.session) {

          message.textContent =
            "Account created successfully. Redirecting...";


          setTimeout(function() {

            window.location.href =
              "Customer/dashboard/index.html";

          }, 1200);


        } else {

          message.innerHTML =
            "Account created successfully.<br><br>" +
            "Please check your email and click the confirmation link to verify your account.<br><br>" +
            "After confirming your email, return here and log in.";

          button.disabled = false;

          button.textContent =
            "Create Account";

        }

      }

    });

  </script>

</body>
</html>
