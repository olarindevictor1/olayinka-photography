<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Olayinka Photography</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .reset-box {
      width: 100%;
      max-width: 430px;
      background: #1b1b1b;
      padding: 35px 25px;
      border-radius: 14px;
    }

    .logo {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #c9a86a;
      margin-bottom: 30px;
      font-size: 14px;
    }

    h2 {
      font-family: Georgia, serif;
      margin-bottom: 8px;
    }

    .intro {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #444;
      border-radius: 7px;
      background: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #c9a86a;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #c9a86a;
      color: #111;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    .links a {
      color: #c9a86a;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="reset-box">

    <div class="logo">OLAYINKA</div>

    <div class="subtitle">
      PHOTOGRAPHY
    </div>

    <h2>Create a new password</h2>

    <p class="intro">
      Enter your new password below.
    </p>

    <form id="resetForm">

      <label for="password">
        New password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="8"
        required
      >

      <label for="confirmPassword">
        Confirm new password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
        minlength="8"
        required
      >

      <button
        type="submit"
        id="resetButton"
      >
        Update Password
      </button>

    </form>

    <div id="message"></div>

    <div class="links">
      <a href="login.html">
        Back to Login
      </a>
    </div>

    <a
      class="home"
      href="index.html"
    >
      ← Back to website
    </a>

  </div>


  <script>

    const supabaseUrl =
      "https://qgaqdnlqftlazzqxykia.supabase.co";

    const supabaseKey =
      "sb_publishable_3ZomhHBPqFeZUw7C6RNEfg_EBP4OwvH";

    const supabaseClient =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );


    const form =
      document.getElementById("resetForm");

    const button =
      document.getElementById("resetButton");

    const message =
      document.getElementById("message");


    

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        message.textContent = "";


        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          message.style.color =
            "#ff7777";

          return;
        }


        if (password.length < 8) {

          message.textContent =
            "Password must be at least 8 characters.";

          message.style.color =
            "#ff7777";

          return;
        }


        button.disabled = true;

        button.textContent =
          "Updating...";


        const { error } =
          await supabaseClient.auth
            .updateUser({
              password: password
            });


        if (error) {

          message.textContent =
            error.message;

          message.style.color =
            "#ff7777";

          button.disabled = false;

          button.textContent =
            "Update Password";

          return;
        }


        message.textContent =
          "Password updated successfully.";

        message.style.color =
          "#c9a86a";


        form.reset();

        button.textContent =
          "Password Updated";


        setTimeout(function() {

          window.location.href =
            "login.html";

        }, 1800);

      }
    );

  </script>

</body>
</html>
