<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign in | OLAYINKA PHOTOGRAPHY</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    window.OLAYINKA_SUPABASE_URL =
      "https://qgaqdnlqftlazzqxykia.supabase.co";

    window.OLAYINKA_SUPABASE_KEY =
      "sb_publishable_3ZomhHBPqFeZUw7C6RNEfg_EBP4OwvH";
  </script>
</head>


<body>

  <!-- HEADER -->

  <header class="site-header">

    <a
      class="brand"
      href="index.html"
    >
      OLAYINKA
      <span>PHOTOGRAPHY</span>
    </a>

    <a
      href="index.html"
      style="text-decoration:none;color:#fff"
    >
      ← Home
    </a>

  </header>


  <!-- LOGIN -->

  <main
    class="section"
    style="max-width:620px;margin:auto;min-height:75vh"
  >

    <p class="eyebrow">
      ACCOUNT
    </p>

    <h1
      style="
        font-family:Georgia,serif;
        font-size:48px;
        line-height:1.05;
        margin-bottom:15px;
      "
    >
      Sign in to continue.
    </h1>

    <p style="margin-bottom:30px">
      Sign in to manage your bookings,
      view updates and book your next
      photography session.
    </p>


    <!-- LOGIN FORM -->

    <div class="service-card">

      <form id="loginForm">

        <label for="email">
          Email address
        </label>

        <input
          type="email"
          id="email"
          required
          autocomplete="email"
          placeholder="Enter your email"
          style="
            width:100%;
            padding:14px;
            margin:8px 0 20px;
            border:1px solid #d8d2c7;
            border-radius:8px;
            font-size:15px;
          "
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
          style="
            width:100%;
            padding:14px;
            margin:8px 0 12px;
            border:1px solid #d8d2c7;
            border-radius:8px;
            font-size:15px;
          "
        >


        <div
          style="
            text-align:right;
            margin-bottom:20px;
          "
        >

          <a
            href="forgot-password.html"
            style="
              color:#9b791b;
              text-decoration:none;
              font-size:14px;
            "
          >
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="btn primary"
          id="loginButton"
          style="
            border:none;
            cursor:pointer;
            width:100%;
          "
        >
          Sign in
        </button>


        <p
          id="loginMessage"
          style="
            margin-top:18px;
            text-align:center;
          "
        ></p>

      </form>


      <div
        style="
          text-align:center;
          margin-top:25px;
          padding-top:20px;
          border-top:1px solid #ddd6c9;
        "
      >

        <p style="margin-bottom:10px">

          <a
            href="./signup.html"
            class="signup-link"
          >
            Don't have an account?
          </a>

        </p>

        <a
          href="./signup.html"
          class="btn secondary"
        >
          Create account
        </a>

      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <strong>
      OLAYINKA PHOTOGRAPHY
    </strong>

    <span>
      © 2026
    </span>

  </footer>


  <!-- LOGIN SCRIPT -->

  <script>

    const supabaseClient =
      window.supabase.createClient(
        window.OLAYINKA_SUPABASE_URL,
        window.OLAYINKA_SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
          "Signing in...";

        loginMessage.textContent = "";


        // SIGN IN

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          console.error(
            "Login error:",
            error
          );

          loginMessage.textContent =
            error.message;

          loginMessage.style.color =
            "#b42318";

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign in";

          return;
        }


        if (!data.user) {

          loginMessage.textContent =
            "Login failed. Please try again.";

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign in";

          return;
        }


        // GET USER ROLE

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", data.user.id)
            .single();


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );

          loginMessage.textContent =
            "Unable to check account role.";

          loginMessage.style.color =
            "#b42318";

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign in";

          return;
        }


        loginMessage.textContent =
          "Login successful. Redirecting...";

        loginMessage.style.color =
          "#557a32";


        // ADMIN

        if (profile.role === "admin") {

          window.location.href =
            "./Admin/dashboard/index.html";

          return;
        }


        // CUSTOMER

        window.location.href =
          "./Customer/dashboard/index.html";

      }

    );

  </script>

</body>

</html>
